name: CI
on:
  pull_request:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:content
      - run: npm run audit:similarity
      - run: npm run build
      - run: npm run audit:prune
      - run: npm run audit:monitor
      - run: npm run audit:phase2:static
      - run: npm run audit:phase3:static
