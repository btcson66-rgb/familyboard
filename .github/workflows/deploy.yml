name: Deploy FamilyBoard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run audit:content
      - run: npm run audit:similarity
      - run: node scripts/generate-icons.mjs
      - run: npm run build
        env:
          PUBLIC_GA4_MEASUREMENT_ID: ${{ vars.PUBLIC_GA4_MEASUREMENT_ID }}
          # 2026-08-24: was ${{ vars.PUBLIC_ADSENSE_PUBLISHER_ID }}. That repo variable's
          # state cannot be verified from source, and if it is unset the build injects an
          # empty string, which silently drops both the account meta and the verification
          # loader — the site would go to AdSense review with no ad code at all. The
          # publisher ID is public information anyway (public/ads.txt serves it verbatim),
          # so it is written literally here, the same way funnytools, roomfeng and
          # worthcalc do it. Keep in sync with public/ads.txt and scripts/monitor-live.mjs.
          PUBLIC_ADSENSE_PUBLISHER_ID: pub-9117672212804270
          PUBLIC_AMAZON_ASSOCIATES_TAG: ${{ vars.PUBLIC_AMAZON_ASSOCIATES_TAG }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: ./dist }
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
